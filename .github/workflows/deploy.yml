name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Stamp build version
        run: |
          SHA=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat > src/app/version.ts <<VERSION
          export const APP_VERSION = {
            sha: '${SHA}',
            builtAt: '${BUILT_AT}',
          };
          VERSION

      - run: npx ng build --configuration production --base-href /ArrowPlot/

      # GitHub Pages has no SPA fallback: serve the app for deep links too.
      - run: cp dist/ArrowPlot/browser/index.html dist/ArrowPlot/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ArrowPlot/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
